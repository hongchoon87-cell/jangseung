<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jangseung · Agent Vault</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e3e0d8; --text: #1d1c1a; --muted: #6b675f;
    --accent: #0f6e63; --accent-soft: #e2f1ee; --good: #15803d; --bad: #b42318; --warn: #a15c07;
    --good-soft: #e6f4ea; --bad-soft: #fbe9e7; --warn-soft: #fdf1dc; --neutral-soft: #efede7;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --line: #33322e; --text: #ecebe6; --muted: #a09c92;
      --accent: #4fc3b3; --accent-soft: #17332f; --good: #6fd08c; --bad: #f08a7e; --warn: #e6b566;
      --good-soft: #1a3324; --bad-soft: #3a1f1c; --warn-soft: #3a2e17; --neutral-soft: #2a2926;
    }
  }
  * { box-sizing: border-box; }
  /* Without this, any rule that sets display (such as .badge) would show hidden elements. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--neutral-soft); color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--good-soft); color: var(--good); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .lang { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px 32px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  section h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: none; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .bar { height: 5px; border-radius: 3px; background: var(--neutral-soft); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar.bad > i { background: var(--bad); }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .empty { color: var(--muted); padding: 8px 0; }
  .limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 28px; }
  .limits .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .limits .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .limits .row small { color: var(--muted); }
  .feed { display: flex; flex-direction: column; gap: 10px; max-height: 720px; overflow-y: auto; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .card .top b { font-size: 14px; }
  .card time { color: var(--muted); font-size: 12px; margin-left: auto; }
  .card p { margin: 6px 0 0; }
  .card .k { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .card .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
  details li.fail { color: var(--bad); }
  .chat { position: sticky; top: 16px; display: flex; flex-direction: column; height: calc(100vh - 110px); min-height: 420px; padding: 0; overflow: hidden; }
  @media (max-width: 1050px) { .chat { position: static; height: 560px; } }
  .chat h2 { padding: 14px 16px 0; }
  .msgs { flex: 1; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .msg.user { color: #0c1f1c; } }
  .msg.assistant { align-self: flex-start; background: var(--neutral-soft); }
  .msg .applied { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .chips button:hover { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  form input { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 14px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { form button { color: #0c1f1c; } }
  form button:disabled { opacity: 0.5; cursor: default; }
  .notice { padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  svg { display: block; width: 100%; height: 150px; }
</style>
</head>
<body>
<header>
  <h1>장승 <span>Jangseung · Agent Vault</span></h1>
  <span id="mode" class="badge"></span>
  <span id="llm" class="badge"></span>
  <span id="paused" class="badge warn" hidden></span>
  <span id="halted" class="badge bad" hidden></span>
  <span class="spacer"></span>
  <a id="vault" class="badge" target="_blank" rel="noopener"></a>
  <span id="tick" class="badge"><i class="dot"></i><span></span></span>
  <button id="lang" class="lang" type="button"></button>
</header>

<main>
  <div class="col">
    <div id="notices" class="col" style="gap:8px"></div>
    <div class="kpis" id="kpis"></div>
    <section><h2 data-t="chartTitle"></h2><div id="chart"></div></section>
    <section><h2 data-t="positionsTitle"></h2><div class="tablewrap" id="positions"></div></section>
    <section><h2 data-t="marketTitle"></h2><div class="tablewrap" id="market"></div></section>
    <section><h2 data-t="limitsTitle"></h2><div class="limits" id="limits"></div></section>
    <section><h2 data-t="feedTitle"></h2><div class="feed" id="feed"></div></section>
  </div>
  <section class="chat">
    <h2 data-t="chatTitle"></h2>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form id="form"><input id="input" autocomplete="off" maxlength="2000"><button id="send" type="submit"></button></form>
  </section>
</main>

<script>

    tickAgo: (s) => `${s}초 전 갱신`, noTick: "대기 중", vault: "금고",
    nav: "순자산", perf: "시작 이후 수익률", dd: "고점 대비 낙폭", buys: "오늘 매수", exposure: "투자 비중",
    idle: (v) => `대기 자금 ${v} USDT`, pps: (v) => `1좌당 ${v}`, ddLimit: (v) => `한도 ${v}%`, buysLimit: (v) => `한도 ${v}회`, expLimit: (v) => `한도 ${v}%`,
    chartTitle: "1좌당 순자산 추이", positionsTitle: "포지션", marketTitle: "시세 (HSKSwap 대 거래소 합의가)",
    limitsTitle: "한도: 금고(온체인)와 내 설정", feedTitle: "판단 기록", chatTitle: "에이전트와 대화",
    asset: "자산", value: "평가액", cost: "매입가", pnl: "평가손익", state: "상태", noPositions: "보유 포지션이 없습니다.",
    enabled: "매수 가능", disabled: "매수 중지", locked: "재진입 잠금", stopHit: "손절선 도달",
    dex: "DEX 현재가", twap: "DEX TWAP", cex: "거래소 합의가", basis: "괴리", trend: "추세", ret1h: "1시간", rsi: "RSI", oracle: "오라클",
    oracleAge: (h) => `${h}시간 전`, noMarket: "시세를 아직 읽지 못했습니다.",
    onchain: "금고 한도", mine: "내 설정", maxTrade: "1회 매수 크기", maxPosition: "자산별 최대 비중", maxExposure: "전체 최대 비중",
    slippage: "TWAP 대비 최대 슬리피지", stopLoss: "손절", drawdown: "낙폭 차단기", perDay: "하루 매수 횟수", cooldown: "매수 간격",
    appetite: "위험 성향", targets: "대상 자산", strategies: "전략", minEdge: "필요 순이익",
    conservative: "보수적", balanced: "균형", aggressive: "공격적", basisS: "괴리", trendS: "추세",
    noFeed: "아직 판단 기록이 없습니다. 규칙이 매매 후보를 만들면 여기에 과정이 남습니다.",
    trigger: "규칙", gate: "검증 관문", judgment: "판단", exec: "체결", memo: "근거 해시", checks: "검증 항목 보기", tx: "거래 보기",
    passed: "통과", netEdge: (v) => `순이익 ${v} bps`, slip: (v) => `TWAP 대비 ${v} bps`, size: (v) => `${v}% 크기`,
    fallback: (r) => `LLM 대신 규칙 사용: ${r}`,
    kind: { "basis-entry": "괴리 매수", "trend-entry": "추세 매수", "basis-exit": "괴리 매도", "take-profit": "익절", "trend-exit": "추세 이탈 매도", "soft-stop": "조기 손절", "hard-stop": "금고 손절", breaker: "차단기 기록" },
    outcome: { sent: "체결", "dry-run": "모의 체결", failed: "실패", skipped: "건너뜀", rejected: "관문 탈락", vetoed: "판단 거부", pending: "대기" },
    source: { llm: "Claude", rule: "규칙", "rule-fallback": "규칙(대체)" },
    placeholder: "예: 지금 손익 알려줘", send: "보내기", thinking: "확인 중…", applied: "적용된 설정",
    chips: ["지금 손익 알려줘", "최근 판단 이유 설명해줘", "매수 크기를 3%로 줄여줘", "잠깐 멈춰"],
    hello: "포지션과 손익을 물어보거나, 매수 크기·거래 빈도·위험 성향·대상 자산을 말로 바꿀 수 있습니다.",
    error: "요청에 실패했습니다.",
  },
  en: {
    live: "Live", dry: "Dry run", rules: "Rules only", pausedBadge: "Paused", haltedBadge: "Drawdown breaker tripped",
    tickAgo: (s) => `updated ${s}s ago`, noTick: "waiting", vault: "Vault",
    nav: "Net asset value", perf: "Return since start", dd: "Drawdown from peak", buys: "Buys today", exposure: "Invested",
    idle: (v) => `${v} USDT idle`, pps: (v) => `${v} per share`, ddLimit: (v) => `limit ${v}%`, buysLimit: (v) => `limit ${v}`, expLimit: (v) => `limit ${v}%`,
    chartTitle: "NAV per share", positionsTitle: "Positions", marketTitle: "Market (HSKSwap vs exchange consensus)",
    limitsTitle: "Limits: vault (on-chain) and my settings", feedTitle: "Decision log", chatTitle: "Talk to the agent",
    asset: "Asset", value: "Value", cost: "Cost", pnl: "Unrealised", state: "State", noPositions: "No open positions.",
    enabled: "buyable", disabled: "buying off", locked: "re-entry locked", stopHit: "stop-loss reached",
    dex: "DEX spot", twap: "DEX TWAP", cex: "Exchange consensus", basis: "Gap", trend: "Trend", ret1h: "1h", rsi: "RSI", oracle: "Oracle",
    oracleAge: (h) => `${h}h old`, noMarket: "No market data yet.",
    onchain: "Vault limit", mine: "My setting", maxTrade: "Size of one buy", maxPosition: "Max per asset", maxExposure: "Max invested",
    slippage: "Max slippage vs TWAP", stopLoss: "Stop-loss", drawdown: "Drawdown breaker", perDay: "Buys per day", cooldown: "Time between buys",
    appetite: "Risk appetite", targets: "Target assets", strategies: "Strategies", minEdge: "Required net edge",
    conservative: "conservative", balanced: "balanced", aggressive: "aggressive", basisS: "gap", trendS: "trend",
    noFeed: "No decisions yet. When a rule proposes a trade, each step is recorded here.",
    trigger: "Rule", gate: "Gate", judgment: "Judgment", exec: "Execution", memo: "Reasoning hash", checks: "Show checks", tx: "View transaction",
    passed: "passed", netEdge: (v) => `net edge ${v} bps`, slip: (v) => `${v} bps vs TWAP`, size: (v) => `${v}% size`,
    fallback: (r) => `Rule used instead of the LLM: ${r}`,
    kind: { "basis-entry": "Gap buy", "trend-entry": "Trend buy", "basis-exit": "Gap sell", "take-profit": "Take profit", "trend-exit": "Trend exit", "soft-stop": "Early stop", "hard-stop": "Vault stop-loss", breaker: "Breaker recorded" },
    outcome: { sent: "Executed", "dry-run": "Simulated", failed: "Failed", skipped: "Skipped", rejected: "Stopped by gate", vetoed: "Vetoed", pending: "Pending" },
    source: { llm: "Claude", rule: "Rule", "rule-fallback": "Rule (fallback)" },
    placeholder: "e.g. How am I doing?", send: "Send", thinking: "Checking…", applied: "Settings applied",
    chips: ["How am I doing?", "Explain the latest decision", "Cut the buy size to 3%", "Pause for now"],
    hello: "Ask about positions and profit, or change buy size, trade frequency, risk appetite and target assets in plain words.",
    error: "The request failed.",
  },
};

let lang = localStorage.getItem("lang") || (navigator.language.startsWith("ko") ? "ko" : "en");
let state = null;
let chatLog = [];
const t = () => TEXT[lang];
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child) node.append(child);
  return node;
}
const fmt = (n, d = 2) => (n === undefined || n === null ? "–" : Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }));
const price = (n) => (n === undefined || n === null ? "–" : n >= 100 ? fmt(n, 2) : n >= 1 ? fmt(n, 4) : fmt(n, 5));
const signed = (n, d = 0, unit = "") => (n === undefined || n === null ? "–" : `${n > 0 ? "+" : ""}${fmt(n, d)}${unit}`);
const tone = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");
const short = (a) => (a ? `${a.slice(0, 6)}…${a.slice(-4)}` : "");
const clock = (ms) => new Date(ms).toLocaleTimeString(lang === "ko" ? "ko-KR" : "en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

function renderHeader() {
  const s = state;
  $("lang").textContent = lang === "ko" ? "EN" : "한국어";
  $("mode").textContent = s.mode === "live" ? t().live : t().dry;
  $("mode").className = `badge ${s.mode === "live" ? "good" : "warn"}`;
  $("llm").textContent = s.llm.enabled ? s.llm.model : t().rules;
  $("llm").className = `badge ${s.llm.enabled ? "accent" : ""}`;
  $("paused").hidden = !s.settings.paused; $("paused").textContent = t().pausedBadge;
  $("halted").hidden = !s.portfolio?.halted; $("halted").textContent = t().haltedBadge;
  $("vault").textContent = `${t().vault} ${short(s.vault)}`;
  $("vault").href = `${s.explorerUrl}/address/${s.vault}`;
  const last = s.status.lastTickAt;
  $("tick").className = `badge ${s.status.lastError ? "bad" : last ? "good" : ""}`;
  $("tick").lastElementChild.textContent = last ? t().tickAgo(Math.max(0, Math.round((Date.now() - last) / 1000))) : t().noTick;

  const notices = [];
  if (s.status.lastError) notices.push(el("div", { class: "notice bad", text: s.status.lastError }));
  for (const w of s.status.warnings || []) notices.push(el("div", { class: "notice", text: w }));
  $("notices").replaceChildren(...notices);
}

function kpi(label, value, sub, cls = "", bar) {
  return el("div", { class: "kpi" },
    el("div", { class: "label", text: label }),
    el("div", { class: `value ${cls}`, text: value }),
    el("div", { class: "sub", text: sub }),
    bar !== undefined && el("div", { class: `bar ${bar.bad ? "bad" : ""}` }, el("i", { style: `width:${Math.min(100, Math.max(0, bar.pct))}%` })),
  );
}

function renderKpis() {
  const p = state.portfolio;
  if (!p) { $("kpis").replaceChildren(); return; }
  const ddPct = p.drawdownBps / 100, ddLimit = p.policy.maxDrawdownBps / 100;
  $("kpis").replaceChildren(
    kpi(t().nav, `${fmt(p.navUsdt)} USDT`, t().idle(fmt(p.idleUsdt))),
    kpi(t().perf, signed(p.performancePct, 2, "%"), t().pps(fmt(p.pricePerShare, 4)), tone(p.performancePct)),
    kpi(t().dd, `${fmt(ddPct)}%`, t().ddLimit(fmt(ddLimit, 0)), "", { pct: (ddPct / ddLimit) * 100, bad: ddPct / ddLimit > 0.6 }),
    kpi(t().buys, `${p.buysToday}`, t().buysLimit(p.effective.maxTradesPerDay), "", { pct: (p.buysToday / Math.max(1, p.effective.maxTradesPerDay)) * 100 }),
    kpi(t().exposure, `${fmt(p.exposurePct, 1)}%`, t().expLimit(fmt(p.policy.maxExposureBps / 100, 0)), "", { pct: (p.exposurePct / (p.policy.maxExposureBps / 100)) * 100 }),
  );
}

function renderChart() {
  const points = state.navHistory || [];
  if (points.length < 2) { $("chart").replaceChildren(el("div", { class: "empty", text: "–" })); return; }
  const W = 800, H = 150, pad = 6;
  const xs = points.map((p) => p.t), ys = points.map((p) => p.pps);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = Math.min(...ys, 1), maxY = Math.max(...ys, 1);
  const span = Math.max(maxY - minY, 0.002); minY -= span * 0.15; maxY += span * 0.15;
  const x = (v) => pad + ((v - minX) / Math.max(1, maxX - minX)) * (W - 2 * pad);
  const y = (v) => H - pad - ((v - minY) / (maxY - minY)) * (H - 2 * pad);
  const path = points.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.pps).toFixed(1)}`).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  const base = document.createElementNS(ns, "line");
  base.setAttribute("x1", pad); base.setAttribute("x2", W - pad); base.setAttribute("y1", y(1)); base.setAttribute("y2", y(1));
  base.setAttribute("stroke", "var(--line)"); base.setAttribute("stroke-dasharray", "4 4");
  const line = document.createElementNS(ns, "path");
  line.setAttribute("d", path); line.setAttribute("fill", "none"); line.setAttribute("stroke", "var(--accent)");
  line.setAttribute("stroke-width", "2"); line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(base, line);
  $("chart").replaceChildren(svg);
}

function table(headers, rows, emptyText) {
  if (rows.length === 0) return el("div", { class: "empty", text: emptyText });
  return el("table", {},
    el("thead", {}, el("tr", {}, headers.map((h) => el("th", { text: h })))),
    el("tbody", {}, rows.map((cells) => el("tr", {}, cells.map((c) => (c instanceof Node ? el("td", {}, c) : el("td", { text: c.text ?? c, class: c.cls })))))),
  );
}

function renderPositions() {
  const p = state.portfolio;
  const now = Date.now() / 1000;
  const rows = (p?.positions || []).filter((x) => x.balance !== "0").map((x) => [
    x.asset, `${fmt(x.valueUsdt)} USDT`, `${fmt(x.costUsdt)} USDT`,
    { text: signed(x.unrealizedBps, 0, " bps"), cls: tone(x.unrealizedBps) },
    x.stopLossReached ? el("span", { class: "badge bad", text: t().stopHit })
      : x.lockedUntil > now ? el("span", { class: "badge warn", text: t().locked })
      : el("span", { class: `badge ${x.enabled ? "good" : ""}`, text: x.enabled ? t().enabled : t().disabled }),
  ]);
  $("positions").replaceChildren(table([t().asset, t().value, t().cost, t().pnl, t().state], rows, t().noPositions));
}

function renderMarket() {
  const rows = (state.market?.assets || []).map((a) => [
    a.asset, price(a.dexSpot), price(a.dexTwap), price(a.cexMid),
    { text: signed(a.basisBps, 0, " bps"), cls: tone(-a.basisBps) },
    { text: signed(a.trendBps, 0, " bps"), cls: tone(a.trendBps) },
    { text: signed(a.ret1hBps, 0, " bps"), cls: tone(a.ret1hBps) },
    a.rsi14 ?? "–",
    a.oraclePrice ? `${price(a.oraclePrice)} · ${t().oracleAge(a.oracleAgeHours)}` : "–",
  ]);
  $("market").replaceChildren(table([t().asset, t().dex, t().twap, t().cex, t().basis, t().trend, t().ret1h, t().rsi, t().oracle], rows, t().noMarket));
}

function renderLimits() {
  const p = state.portfolio, s = state.settings;
  if (!p) { $("limits").replaceChildren(); return; }
  const pol = p.policy;
  const row = (label, value, note) => el("div", { class: "row" }, el("span", { text: label }), el("span", {}, el("b", { text: value }), note && el("small", { text: ` ${note}` })));
  const minutes = (sec) => (sec >= 60 ? `${fmt(sec / 60, 0)}${lang === "ko" ? "분" : " min"}` : `${sec}${lang === "ko" ? "초" : "s"}`);
  $("limits").replaceChildren(
    row(t().maxTrade, `${s.positionSizeBps / 100}%`, `${t().onchain} ${pol.maxTradeBps / 100}%`),
    row(t().perDay, `${s.maxTradesPerDay}`, `${t().onchain} ${pol.maxTradesPerDay}`),
    row(t().cooldown, minutes(p.effective.minSecondsBetweenTrades), `${t().onchain} ${minutes(pol.cooldown)}`),
    row(t().appetite, t()[s.riskAppetite], `${t().minEdge} ${state.thresholds.minNetEdgeBps} bps`),
    row(t().targets, s.targetAssets.join(", ") || "–"),
    row(t().strategies, s.strategies.map((x) => t()[`${x}S`]).join(", ") || "–"),
    row(t().maxPosition, `${pol.maxPositionBps / 100}%`, t().onchain),
    row(t().maxExposure, `${pol.maxExposureBps / 100}%`, t().onchain),
    row(t().slippage, `${pol.maxSlippageBps / 100}%`, t().onchain),
    row(t().stopLoss, `-${pol.stopLossBps / 100}%`, t().onchain),
    row(t().drawdown, `-${pol.maxDrawdownBps / 100}%`, t().onchain),
  );
}

const OUTCOME_TONE = { sent: "good", "dry-run": "accent", failed: "bad", skipped: "warn", rejected: "", vetoed: "warn", pending: "" };

function decisionCard(d) {
  const lines = [el("p", {}, el("span", { class: "k", text: t().trigger }), d.trigger)];

  if (d.gate.checks.length > 0) {
    const summary = d.gate.failed
      ? d.gate.failed.detail
      : [t().passed, d.gate.netEdgeBps !== undefined && t().netEdge(d.gate.netEdgeBps), d.gate.slippageVsTwapBps !== undefined && t().slip(d.gate.slippageVsTwapBps)].filter(Boolean).join(" · ");
    lines.push(el("p", { class: d.gate.failed ? "neg" : "" }, el("span", { class: "k", text: t().gate }), summary));
    lines.push(el("details", {}, el("summary", { text: t().checks }), el("ul", {}, d.gate.checks.map((c) => el("li", { class: c.ok ? "" : "fail", text: `${c.ok ? "✓" : "✗"} ${c.detail}` })))));
  }
  if (d.judgment) {
    const j = d.judgment;
    lines.push(el("p", {}, el("span", { class: "k", text: `${t().judgment} · ${t().source[j.source]}${j.sizeFraction > 0 && j.sizeFraction < 1 ? ` · ${t().size(Math.round(j.sizeFraction * 100))}` : ""}` }), j.rationale));
    if (j.fallbackReason) lines.push(el("p", { class: "k", text: t().fallback(j.fallbackReason) }));
    if (j.riskFlags?.length) lines.push(el("p", {}, j.riskFlags.map((f) => el("span", { class: "badge warn", text: f, style: "margin-right:4px" }))));
  }
  if (d.execution) {
    const e = d.execution;
    const parts = [e.baseUsdt !== undefined && `${fmt(e.baseUsdt)} USDT`, e.realizedPnlUsdt !== undefined && d.side === "sell" && `PnL ${signed(e.realizedPnlUsdt, 2)} USDT`, e.gasUsed && `gas ${Number(e.gasUsed).toLocaleString()}`, e.error].filter(Boolean).join(" · ");
    lines.push(el("p", { class: e.status === "failed" ? "neg" : "" }, el("span", { class: "k", text: t().exec }), parts || "–",
      e.txHash && el("a", { href: `${state.explorerUrl}/tx/${e.txHash}`, target: "_blank", rel: "noopener", text: ` ${t().tx}` })));
  }
  if (d.memo) lines.push(el("p", {}, el("span", { class: "k", text: t().memo }), el("span", { class: "mono", text: d.memo })));

  return el("div", { class: "card" },
    el("div", { class: "top" },
      el("b", { text: `${d.asset} · ${t().kind[d.kind] || d.kind}` }),
      el("span", { class: `badge ${OUTCOME_TONE[d.outcome] || ""}`, text: t().outcome[d.outcome] || d.outcome }),
      el("time", { text: clock(d.at) })),
    lines);
}

function renderFeed() {
  const list = state.decisions || [];
  const open = new Set([...document.querySelectorAll("#feed details[open]")].map((n) => n.closest(".card").dataset.id));
  const cards = list.map((d) => { const c = decisionCard(d); c.dataset.id = d.id; if (open.has(d.id)) c.querySelector("details")?.setAttribute("open", ""); return c; });
  $("feed").replaceChildren(...(cards.length ? cards : [el("div", { class: "empty", text: t().noFeed })]));
}

function renderChat() {
  const nodes = [el("div", { class: "msg assistant", text: t().hello })];
  for (const m of chatLog) {
    const node = el("div", { class: `msg ${m.role}`, text: m.content });
    if (m.applied?.length) {
      node.append(el("div", { class: "applied" }, el("b", { text: t().applied }), m.applied.map((a) => el("div", { text: `${a.label}: ${a.from} → ${a.to}${a.note ? ` (${a.note})` : ""}` }))));
    }
    nodes.push(node);
  }
  $("msgs").replaceChildren(...nodes);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t()[n.dataset.t]; });
  $("input").placeholder = t().placeholder;
  $("send").textContent = t().send;
  $("chips").replaceChildren(...t().chips.map((c) => el("button", { type: "button", text: c })));
}

function render() {
  if (!state) return;
  renderHeader(); renderKpis(); renderChart(); renderPositions(); renderMarket(); renderLimits(); renderFeed();
}

async function sendChat(message) {
  chatLog.push({ role: "user", content: message });
  chatLog.push({ role: "assistant", content: t().thinking, pending: true });
  renderChat();
  $("send").disabled = true;
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message }) });
    const data = await res.json();
    chatLog.pop();
    chatLog.push({ role: "assistant", content: res.ok ? data.reply : data.error || t().error, applied: data.applied });
  } catch {
    chatLog.pop();
    chatLog.push({ role: "assistant", content: t().error });
  }
  $("send").disabled = false;
  renderChat();
}

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const message = $("input").value.trim();
  if (!message || $("send").disabled) return;
  $("input").value = "";
  sendChat(message);
});
$("chips").addEventListener("click", (event) => {
  if (event.target.tagName === "BUTTON" && !$("send").disabled) sendChat(event.target.textContent);
});
$("lang").addEventListener("click", () => {
  lang = lang === "ko" ? "en" : "ko";
  localStorage.setItem("lang", lang);
  renderStatic(); render(); renderChat();
});

async function boot() {
  renderStatic();
  const first = await (await fetch("/api/state")).json();
  state = first.state;
  chatLog = first.chat.map((m) => ({ role: m.role, content: m.content }));
  render(); renderChat();
  const events = new EventSource("/api/events");
  events.onmessage = (event) => { state = JSON.parse(event.data); render(); };
  setInterval(() => state && renderHeader(), 1000);
}
boot();
</script>
</body>
</html>
